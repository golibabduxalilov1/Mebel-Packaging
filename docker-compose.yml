services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bazis
      POSTGRES_PASSWORD: bazis
      POSTGRES_DB: bazis_upokovka
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bazis -d bazis_upokovka"]
      interval: 5s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://bazis:bazis@db:5432/bazis_upokovka?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-almashtiring-uzun-tasodifiy-satr}
      ADMIN_PHONE: ${ADMIN_PHONE:-+998901234567}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    volumes:
      - files:/data
    ports:
      - "8080:8080"
    profiles: ["full"]

volumes:
  pgdata:
  files:
